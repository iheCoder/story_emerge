<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <link rel="icon" href="data:,">
  <title>故事初生</title>
  <meta name="description" content="从一句灵感开始，让故事逐章生长。">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand-button" type="button" aria-label="回到创造页">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>故事初生</span>
      </button>
      <nav class="primary-nav" aria-label="主导航">
        <button class="nav-link is-active" data-route="create" type="button">创造</button>
        <button class="nav-link" data-route="library" type="button">书架</button>
      </nav>
      <span class="quiet-status" id="quiet-status">等待灵感</span>
    </header>

    <main>
      <section class="view create-view is-active" id="create-view" aria-labelledby="create-title">
        <canvas class="story-core" id="story-core" aria-hidden="true"></canvas>
        <div class="create-heading">
          <h1 id="create-title">你想进入一个<br>怎样的<span>故事</span>？</h1>
          <p>一个画面、一段情节、一个人物，甚至只是某种感觉都可以。</p>
        </div>

        <form class="creation-form" id="creation-form">
          <div class="idea-field">
            <div class="field-heading">
              <label for="idea">故事灵感</label>
              <span><strong id="idea-count">0</strong> / 10000</span>
            </div>
            <textarea id="idea" name="idea" rows="7" maxlength="10000">门口的圆圈</textarea>
            <span class="input-node" aria-hidden="true"></span>
          </div>

          <fieldset class="length-fieldset">
            <legend>故事会走多远</legend>
            <div class="length-control">
              <label>
                <input type="radio" name="length" value="short">
                <span class="length-node" aria-hidden="true"></span>
                <span class="length-copy"><strong>短篇</strong><small>聚焦一个核心事件</small></span>
              </label>
              <label>
                <input type="radio" name="length" value="medium" checked>
                <span class="length-node" aria-hidden="true"></span>
                <span class="length-copy"><strong>中篇</strong><small>让关系充分展开</small></span>
              </label>
              <label>
                <input type="radio" name="length" value="long">
                <span class="length-node" aria-hidden="true"></span>
                <span class="length-copy"><strong>长篇</strong><small>容纳更大的命运</small></span>
              </label>
              <label>
                <input type="radio" name="length" value="epic">
                <span class="length-node" aria-hidden="true"></span>
                <span class="length-copy"><strong>超长篇</strong><small>允许百章自然生长</small></span>
              </label>
            </div>
          </fieldset>

          <p class="form-error" id="form-error" role="alert"></p>
          <button class="creation-trigger" type="submit" id="create-button">
            <span>开始创造</span><span aria-hidden="true">→</span>
          </button>
        </form>
      </section>

      <section class="view genesis-view" id="genesis-view" aria-labelledby="story-title">
        <canvas class="genesis-canvas" id="genesis-canvas" aria-hidden="true"></canvas>
        <div class="genesis-heading">
          <p id="story-kicker">故事正在形成</p>
          <h2 id="story-title">一个世界正在回应你</h2>
          <p id="story-logline">人物、记忆与命运正在寻找彼此的位置。</p>
        </div>
        <div class="chapter-orbit" id="chapter-orbit" aria-label="故事章节轨迹"></div>
        <div class="genesis-footer">
          <div class="genesis-status" aria-live="polite">
            <span class="status-pulse" aria-hidden="true"></span>
            <p id="genesis-status-text">正在理解你的故事</p>
          </div>
          <div class="preview-decision" id="preview-decision" hidden>
            <p>故事已经开始了。接下来怎么走？</p>
            <div>
              <button class="command-button is-primary" id="next-chapter-button" type="button">继续下一章 <span>→</span></button>
              <button class="command-button" id="complete-story-button" type="button">完成整个故事</button>
            </div>
          </div>
        </div>
      </section>

      <section class="view library-view" id="library-view" aria-labelledby="library-title">
        <div class="library-heading">
          <h1 id="library-title">你的故事<br>仍在这里。</h1>
          <p>回到上次停下的位置，或者让尚未完成的命运继续生长。</p>
        </div>
        <div class="library-rail" id="library-list" aria-live="polite"></div>
        <div class="library-empty" id="library-empty" hidden>
          <p>书架还没有故事。</p>
          <button class="text-command" id="empty-create-button" type="button">写下第一个灵感 →</button>
        </div>
      </section>

      <section class="view reader-view" id="reader-view" aria-labelledby="reader-title">
        <div class="reader-shell">
          <aside class="reader-spine" aria-label="章节脊柱">
            <button class="back-command" id="back-to-story" type="button">← 故事轨迹</button>
            <p class="spine-title" id="spine-title">故事章节</p>
            <div class="spine-list" id="spine-list"></div>
          </aside>

          <article class="chapter-article">
            <header>
              <p class="chapter-number" id="reader-number">CHAPTER I</p>
              <h2 id="reader-title">章节正在展开</h2>
              <span class="title-node" aria-hidden="true"></span>
            </header>
            <div class="chapter-body" id="chapter-body"></div>
            <footer class="reader-pager">
              <button class="page-command is-previous" id="reader-previous" type="button" hidden>
                <small>上一章</small><strong id="previous-title"></strong>
              </button>
              <button class="page-command is-next" id="reader-next" type="button" hidden>
                <small>下一章</small><strong id="next-title"></strong>
              </button>
              <button class="page-command is-generate" id="reader-generate-next" type="button" hidden>
                <small>故事仍未结束</small><strong>生成下一章 →</strong>
              </button>
              <p class="reader-ending" id="reader-ending" hidden>这个故事已经抵达结局。</p>
            </footer>
          </article>

          <aside class="reader-context" aria-label="阅读进度">
            <canvas id="reader-core" width="156" height="156" aria-hidden="true"></canvas>
            <p id="reader-position">第 1 章</p>
            <strong id="reader-progress">1 / 1</strong>
            <span id="reader-story-status">阅读中</span>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
