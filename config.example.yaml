# 复制为 config.yaml 后填写真实密钥。
# config.yaml 已加入 .gitignore，不会被提交到仓库。

providers:
  deepseek:
    api_key: "填写 DeepSeek API Key"
    endpoint: "https://api.deepseek.com/responses"

  openai:
    api_key: "填写 OpenAI API Key"
    endpoint: "https://api.openai.com/v1/responses"

# 每个长期工作流角色可以单独选择供应商和模型。
# Architect 仅初始化；Director 维护阶段方向；Writer 自主决定本章局部发展；Commit 只提取已接受正文。
roles:
  architect:
    provider: deepseek
    model: deepseek-v4-flash
    reasoning_effort: low
    max_output_tokens: 16000

  director:
    provider: deepseek
    model: deepseek-v4-flash
    reasoning_effort: low
    max_output_tokens: 6000

  writer:
    provider: deepseek
    model: deepseek-v4-flash
    reasoning_effort: none
    max_output_tokens: 12000

  editor:
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: low
    max_output_tokens: 6000

  commit:
    provider: openai
    model: gpt-5.6-luna
    reasoning_effort: none
    max_output_tokens: 24000
